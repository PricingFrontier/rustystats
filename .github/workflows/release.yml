# Publishes the version the code declares on main to PyPI, then tags it.
#
# Builds one abi3 wheel per platform (cp310-abi3: CPython 3.10 and every later version)
# for Linux x86_64 and aarch64, Windows x64, and macOS x86_64 and arm64, plus the sdist.
# A new Python version needs no change here.
#
# Releasing: in a pull request, run `uv version --bump minor --no-sync` (or patch, or
# major), set the same version in crates/rustystats/Cargo.toml and
# crates/rustystats-core/Cargo.toml, and add the version's section to CHANGELOG.md.
# Merge it, wait for main's CI to pass, then run this workflow from the Actions tab
# (Release -> Run workflow, on main). It never edits or commits to the repository, and
# it refuses a version PyPI already has or that is already tagged, so an unbumped main
# cannot be released twice.
#
# Tick "dry run" to build and smoke-check without publishing. A dry run can run on any
# branch, which is how to test a change to this workflow before it merges.
#
# If a run fails after publishing started, use "Re-run failed jobs": the upload skips
# files PyPI already has, and the tag is created only once PyPI serves exactly this
# run's files.

name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build and smoke-check only, publish nothing"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ── Check the version and main's CI ─────────────────────────────────────
  check:
    name: Check the version and main's CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Publish from main only
        if: ${{ github.ref != 'refs/heads/main' && !inputs.dry_run }}
        run: |
          echo "::error::Run Release on main; this run is on ${GITHUB_REF}."
          exit 1

      - name: Require main's CI to have passed on this commit
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main \
            --event push --commit "$GITHUB_SHA" --limit 1 --json status,conclusion,url \
            --jq '.[0] | select(. != null) | "\(.status)|\(.conclusion)|\(.url)"')
          if [ -z "$run" ]; then
            echo "::error::No CI run on main for ${GITHUB_SHA}; release a commit main's CI has checked."
            exit 1
          fi
          # A running job has an empty conclusion, so split on a separator that
          # keeps empty fields rather than on whitespace.
          IFS='|' read -r status conclusion url <<< "$run"
          if [ "$status" != "completed" ]; then
            echo "::error::main's CI is still running for this commit ($url); run Release when it finishes."
            exit 1
          fi
          if [ "$conclusion" != "success" ]; then
            echo "::error::main's CI finished '$conclusion' for this commit ($url); fix main before releasing."
            exit 1
          fi
          echo "main's CI passed for ${GITHUB_SHA}: $url"

      - uses: actions/checkout@v6

      - name: Refuse a version PyPI already has
        id: version
        run: |
          curl -sSf -o pypi.json https://pypi.org/pypi/rustystats/json
          python3 scripts/check_release_version.py --pypi-json pypi.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Refuse a version that is already tagged
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # --exit-code exits 2 only when no tag matches; any other failure of the
          # lookup must not read as "untagged".
          lookup=0
          git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null || lookup=$?
          case "$lookup" in
            2) echo "v$VERSION is not tagged yet." ;;
            0)
              echo "::error::Tag v$VERSION already exists. Set a new version in a pull request."
              exit 1
              ;;
            *)
              echo "::error::Could not look up tag v$VERSION (git ls-remote exited $lookup); run Release again."
              exit 1
              ;;
          esac

  # ── Linux wheels (x86_64 + aarch64) ──────────────────────────────────────
  linux:
    needs: [check]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          sccache: "true"
          manylinux: auto

      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  # ── Windows wheels (x86_64) ──────────────────────────────────────────────
  windows:
    needs: [check]
    runs-on: windows-latest
    strategy:
      matrix:
        target: [x64]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: ${{ matrix.target }}

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          args: --release --out dist
          sccache: "true"

      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-windows-${{ matrix.target }}
          path: dist

  # ── macOS wheels (x86_64 + aarch64) ─────────────────────────────────────
  macos:
    needs: [check]
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          sccache: "true"

      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  # ── Source distribution ──────────────────────────────────────────────────
  sdist:
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@v6
        with:
          name: wheels-sdist
          path: dist

  # ── Check and smoke-test what was built ─────────────────────────────────
  smoke:
    name: Check and smoke-test the built files
    needs: [check, linux, windows, macos, sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Download all wheels
        uses: actions/download-artifact@v7
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Check the files carry the version
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          ls -l dist
          test -f "dist/rustystats-${VERSION}.tar.gz"
          # Exactly one abi3 wheel per platform, and nothing else besides the sdist.
          for platform in 'manylinux*_x86_64' 'manylinux*_aarch64' win_amd64 'macosx*_x86_64' 'macosx*_arm64'; do
            matches=$(ls dist/rustystats-${VERSION}-cp310-abi3-${platform}.whl 2>/dev/null | wc -l)
            if [ "$matches" -ne 1 ]; then
              echo "::error::Expected one cp310-abi3 ${platform} wheel, found ${matches}."
              exit 1
            fi
          done
          test "$(ls dist | wc -l)" -eq 6

      # The floor and the newest CPython the wheel is tested on. --no-build fails the
      # step if the wheel or any dependency would compile from source.
      - name: Wheel install smoke (Python 3.10 and 3.14)
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          for python in 3.10 3.14; do
            venv=".pkg-wheel-${python}"
            uv venv "$venv" --python "$python"
            uv pip install --no-build --python "$venv/bin/python" dist/rustystats-${VERSION}-cp310-abi3-manylinux*_x86_64.whl
            "./$venv/bin/python" scripts/package_smoke.py
            test "$("./$venv/bin/python" -c 'import rustystats; print(rustystats.__version__)')" = "$VERSION"
          done

      - name: Sdist install smoke
        run: |
          uv venv .pkg-sdist --python 3.12
          uv pip install --python .pkg-sdist/bin/python dist/*.tar.gz
          ./.pkg-sdist/bin/python scripts/package_smoke.py

  # ── Install the Windows and macOS wheels on their own platforms ─────────
  # The runners have Rust installed, so --no-build is what proves nothing compiles.
  smoke-native:
    name: Wheel install smoke (${{ matrix.name }})
    needs: [check, windows, macos]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - name: windows x64
            os: windows-latest
            artifact: wheels-windows-x64
            platform: win_amd64
            python: .pkg-wheel/Scripts/python.exe
          - name: macos arm64
            os: macos-latest
            artifact: wheels-macos-aarch64
            platform: "macosx*_arm64"
            python: .pkg-wheel/bin/python
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - name: Download the wheel
        uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist

      - name: Install into Python 3.14 and smoke-test
        env:
          VERSION: ${{ needs.check.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          PY: ${{ matrix.python }}
        run: |
          uv venv .pkg-wheel --python 3.14
          uv pip install --no-build --python "$PY" dist/rustystats-${VERSION}-cp310-abi3-${PLATFORM}.whl
          "$PY" scripts/package_smoke.py
          # No trailing newline: Windows would print "\r\n" and the "\r" would survive.
          test "$("$PY" -c 'import sys, rustystats; sys.stdout.write(rustystats.__version__)')" = "$VERSION"

  # ── Publish to PyPI ──────────────────────────────────────────────────────
  publish:
    name: Publish to PyPI
    if: ${{ !inputs.dry_run }}
    needs: [check, smoke, smoke-native]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/rustystats/${{ needs.check.outputs.version }}/
    permissions:
      id-token: write  # Required for trusted publishing
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v7
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      # A re-run after a partial upload completes it rather than failing on the
      # file that already made it; `verify` then checks the files are this run's.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  # ── Verify PyPI serves this run's files ─────────────────────────────────
  verify:
    name: Verify PyPI serves this run's files
    if: ${{ !inputs.dry_run }}
    needs: [check, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download all wheels
        uses: actions/download-artifact@v7
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Wait for PyPI to list exactly the built files
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          # PyPI's JSON API can lag an upload by a few minutes.
          for attempt in $(seq 1 20); do
            if curl -sSf -o release.json "https://pypi.org/pypi/rustystats/$VERSION/json" \
              && python3 scripts/verify_pypi_release.py --dist dist --pypi-json release.json; then
              exit 0
            fi
            echo "Attempt $attempt: PyPI does not list exactly the built files yet."
            sleep 30
          done
          echo "::error::PyPI does not serve exactly this run's files for rustystats $VERSION; re-run the failed jobs."
          exit 1

  # ── Tag and create the GitHub Release ───────────────────────────────────
  github-release:
    name: Tag and create the GitHub Release
    if: ${{ !inputs.dry_run }}
    needs: [check, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to create the tag and the release
    steps:
      # Before the download: checkout cleans the workspace.
      - uses: actions/checkout@v6

      - name: Extract this version's notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          awk -v header="## $VERSION" '
            $0 == header { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

      - name: Download all wheels
        uses: actions/download-artifact@v7
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ needs.check.outputs.version }}
          body_path: release-notes.md
          generate_release_notes: true
          files: dist/*
