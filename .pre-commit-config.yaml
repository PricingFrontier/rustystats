repos:
  # NOTE: keep this `rev:` in lock-step with the `uvx ruff@<version>` pin in
  # .github/workflows/ci.yml. The two tools format differently across ruff
  # releases (long `assert` messages have shifted style at least twice), so
  # any version skew means pre-commit and CI fight each other and a clean
  # local commit fails CI (or vice versa). Bump both files together.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all --
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy (-D warnings)
        # Mirror CI: any new clippy lint becomes a hard failure here too,
        # so issues like unnecessary_sort_by / new_without_default are caught
        # before they reach origin instead of failing the workflow.
        entry: cargo clippy --workspace -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
