# =============================================================================
# RustyStats - Rust Workspace Configuration
# =============================================================================
# This is the root configuration file for the Rust components of RustyStats.
# 
# The project is organized as a Cargo "workspace" with two main parts:
#   1. rustystats-core: Pure Rust library with all the math/statistics logic
#   2. rustystats:      Python bindings that expose the Rust code to Python
#
# This separation keeps the core logic clean and testable independently
# from the Python integration layer.
# =============================================================================

[workspace]
members = [
    "crates/rustystats-core",  # Pure Rust statistics library
    "crates/rustystats",       # Python bindings (PyO3)
]
resolver = "2"

# =============================================================================
# Release profile
# =============================================================================
# thin LTO + a single codegen unit let the optimizer inline/vectorize across
# units (notably the hot X'WX kernel). Portable and numerically safe: this only
# changes optimization/LTO — no -ffast-math, no target-cpu pinning — so f64
# results are bit-identical to the default release build.
[profile.release]
lto = "thin"
codegen-units = 1

# =============================================================================
# Shared Dependencies
# =============================================================================
# Dependencies listed here can be inherited by workspace members using:
#   some-crate = { workspace = true }
# This ensures all crates use the same versions, avoiding conflicts.
# =============================================================================

[workspace.dependencies]
# --- Linear Algebra ---
# ndarray: N-dimensional arrays, similar to NumPy for Python
# We use this for all matrix and vector operations
# The "approx" feature enables floating-point comparison support for tests
ndarray = { version = "0.17", features = ["approx"] }

# nalgebra: Pure Rust linear algebra library
# Used for matrix operations in the IRLS solver (no system dependencies needed!)
# The matrixmultiply feature enables optimized cache-blocked matrix multiplication
nalgebra = { version = "0.34", features = ["matrixmultiply"] }

# --- Python Integration ---
pyo3 = { version = "0.29", features = ["extension-module", "generate-import-lib"] }  # Rust <-> Python bridge
numpy = "0.28"                             # NumPy array support for PyO3

# --- Utilities ---
thiserror = "2.0"                          # Easy error type definitions
approx = "0.5"                             # Floating-point comparisons for tests
rayon = "1.10"                             # Data parallelism for multi-threaded computation

# --- Statistical Functions ---
# statrs provides probability distributions for p-value calculations
statrs = "0.18"                            # Statistical distributions & functions

# =============================================================================
# Workspace Lints
# =============================================================================
[workspace.lints.clippy]
unwrap_used = "warn"
excessive_precision = "allow"       # Lanczos/gamma coefficients need exact bit patterns
too_many_arguments = "allow"        # math solvers have many parameters by nature
needless_range_loop = "allow"       # index-based loops are clearer in numeric code
should_implement_trait = "allow"    # from_str/default helpers that aren't the std trait

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }
